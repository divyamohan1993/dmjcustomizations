name: quality-gate
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # nightly T3
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # secrets lane scans full history
      - name: Install shell gate tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Run quality gate
        run: |
          tier=--merge
          [ "${{ github.event_name }}" = schedule ] && tier=--deep
          bash qgate.sh "$tier"
