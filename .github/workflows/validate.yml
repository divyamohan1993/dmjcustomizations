name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate.sh
      - name: humanize-guard (all tracked prose, blocking)
        run: node skills/humanizing-output/humanize-guard.mjs --gate
